          }
        },

          DEFAULT: "9999px"
        }
      }
    }
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
<script>
  /* framer-motion 11.x ships its UMD bundle under the global `Motion`;
     older builds used `FramerMotion`. Alias without clobbering either. */
  window.Motion = window.FramerMotion || window.Motion;
</script>

<script>
  /* Framer Motion emits benign dev warnings about list keys for the
     word-by-word BlurText spans. Filter just those. */
  (function () {
    var nativeError = console.error.bind(console);
    console.error = function () {
      var first = arguments.length ? arguments[0] : "";
      if (typeof first === "string" && first.indexOf("Each child in a list should have a unique") !== -1) return;
      nativeError.apply(null, arguments);
    };
  })();
</script>

<style>
  /* ------------------------------------------------------------------
     Design tokens — mirrors the Figma variable collection so the values
     below can be read against the design without a lookup table.
     ------------------------------------------------------------------ */
  :root {
    --color-bg-canvas: #000000;

    --color-bg-glass: rgba(255, 255, 255, 0.01);
    --color-bg-glass-hover: rgba(255, 255, 255, 0.05);
    --color-bg-glass-raised-hover: rgba(255, 255, 255, 0.08);
    --color-bg-glass-selected: rgba(255, 255, 255, 0.1);

    --color-border-glass-fade: rgba(255, 255, 255, 0.15);
    --color-effect-inner-highlight: rgba(255, 255, 255, 0.1);
    --color-effect-inner-highlight-strong: rgba(255, 255, 255, 0.15);
    --color-effect-shadow-ambient: rgba(0, 0, 0, 0.05);

    --blur-glass: 4px;
    --blur-glass-strong: 50px;
    --stroke-glass: 1.4px;

    --radius-md: 12px;
    --radius-lg: 20px;
  }

  html, body { background: var(--color-bg-canvas); }
  html { scroll-behavior: smooth; }
  body { margin: 0; -webkit-font-smoothing: antialiased; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }

  .liquid-glass {
    background: var(--color-bg-glass);
    background-blend-mode: luminosity;
    backdrop-filter: blur(var(--blur-glass));
    -webkit-backdrop-filter: blur(var(--blur-glass));
    border: none;
    box-shadow: inset 0 1px 1px var(--color-effect-inner-highlight);
    position: relative;
    overflow: hidden;
  }

  .liquid-glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: var(--stroke-glass);
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.45) 0%,
      rgba(255, 255, 255, 0.15) 20%,
      rgba(255, 255, 255, 0) 40%,
      rgba(255, 255, 255, 0) 60%,
      rgba(255, 255, 255, 0.15) 80%,
      rgba(255, 255, 255, 0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    pointer-events: none;
    /* the ring is a ::before, so it would sit under any absolutely
       positioned child (card artwork, the nav's selected pill) */
    z-index: 2;
  }

  .liquid-glass-strong {
    background: var(--color-bg-glass);
    background-blend-mode: luminosity;
    backdrop-filter: blur(var(--blur-glass-strong));
    -webkit-backdrop-filter: blur(var(--blur-glass-strong));
    border: none;
    box-shadow: 4px 4px 4px var(--color-effect-shadow-ambient),
                inset 0 1px 1px var(--color-effect-inner-highlight-strong);
    position: relative;
    overflow: hidden;
  }

  .liquid-glass-strong::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: var(--stroke-glass);
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.5) 0%,
      rgba(255, 255, 255, 0.2) 20%,
      rgba(255, 255, 255, 0) 40%,
      rgba(255, 255, 255, 0) 60%,
      rgba(255, 255, 255, 0.2) 80%,
      rgba(255, 255, 255, 0.5) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    pointer-events: none;
    /* the ring is a ::before, so it would sit under any absolutely
       positioned child (card artwork, the nav's selected pill) */
    z-index: 2;
  }

  /* Card surfaces. Figma: "Hover lifts the surface from 1% to 5%".
     Skills cards are drawn on the already-raised 5% surface, so they
     lift one further step. */
  .glass-lift { transition: background-color 300ms ease; }
  .glass-lift:hover { background: var(--color-bg-glass-hover); }

  .glass-raised {
    background: var(--color-bg-glass-hover);
    transition: background-color 300ms ease;
  }
  .glass-raised:hover { background: var(--color-bg-glass-raised-hover); }
</style>
