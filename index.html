<!-- Every local script and stylesheet below carries ?v=20260921a.

     GitHub Pages serves these files with a ten-minute cache and no
     fingerprint in their names, so a browser that has the page already
     keeps running the JavaScript it downloaded before — the markup
     updates and the copy inside the components does not. Bumping the
     string makes each file a new URL, which a browser has no choice but
     to fetch.

     Bump it on any deploy that changes a file under components/ or
     styles/. One find-and-replace across this file and project.html.
     Changing nothing but text inside these two files does not need it. -->

<script>
  /* framer-motion 11.x ships its UMD bundle under the global `Motion`;
     older builds used `FramerMotion`. Alias without clobbering either. */
  window.Motion = window.FramerMotion || window.Motion;
</script>

<script>
  /* Framer Motion emits benign dev warnings about list keys for the
     word-by-word BlurText spans. Filter just those. */
  (function () {
    var nativeError = console.error.bind(console);
    console.error = function () {
      var first = arguments.length ? arguments[0] : "";
      if (typeof first === "string" && first.indexOf("Each child in a list should have a unique") !== -1) return;
      nativeError.apply(null, arguments);
    };
  })();
</script>
